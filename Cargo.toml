[package]
name = "rsmorphy"
version = "0.4.0"
authors = ["Alexander Irbis <irbis.labs@gmail.com>"]
license = "MIT/Apache-2.0"
description = "Morphological analyzer / inflection engine for Russian and Ukrainian (soon) languages (WIP)"
keywords = ["nlp", "inflection", "pluralize", "russian", "ukrainian"]
categories = ["text-processing", "value-formatting"]
readme = "README.md"
homepage = "https://github.com/irbis-labs/rsmorphy"
repository = "https://github.com/irbis-labs/rsmorphy"
documentation = "https://docs.rs/rsmorphy/"
edition = "2018"
publish = true

[badges]
travis-ci = { repository = "irbis-labs/rsmorphy" }


[features]
default = []
profile = []

# Tracing features.
# Normally, you don't need them.

trace_all = [
    "trace_analyzer",
    "trace_dawg",
    "trace_opencorpora",
]
trace_analyzer = []
trace_dawg = []
trace_opencorpora = []


[dependencies]
base64 = "0.21"
bincode = "1.2"
boolinator = "2.4"
byteorder = "1.3"
derive_more = { version = "1.0.0-beta.3", features = ["from"] }
env_logger = "0.10"
flate2 = { version = "1.0" }
lazy_static = "1.0"
log = "0.4"
maplit = "1.0"
num = "0.4"
regex = "1.3"
roman = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.4"
inlinable_string = "0.1"
string_cache = "0.8"
unicode_categories = "0.1"

dict-ru = { version = "0.1", package = "rsmorphy-dict-ru", path = "./dict/ru" }
#dict-uk = { version = "0.1", package = "rsmorphy-dict-uk", path = "./dict/uk" }


[dev-dependencies]
rustyline = "6.0"


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
