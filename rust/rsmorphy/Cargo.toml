[package]
name = "rsmorphy"
version = "0.5.0-dev.1"
authors = ["Alexander Irbis <irbis.labs@gmail.com>"]
license = "MIT/Apache-2.0"
description = "Morphological analyzer / inflection engine for Russian and Ukrainian (soon) languages (WIP)"
keywords = ["nlp", "inflection", "pluralize", "russian", "ukrainian"]
categories = ["text-processing", "value-formatting"]
readme = "README.md"
homepage = "https://github.com/irbis-labs/rsmorphy"
repository = "https://github.com/irbis-labs/rsmorphy"
documentation = "https://docs.rs/rsmorphy/"
edition = "2021"
publish = true

[badges]
travis-ci = { repository = "irbis-labs/rsmorphy" }


[features]
default = ["dict_load-include_static", "lang-all"]

# Enable languages and corresponding dictionaries.
# At least one language must be selected

lang-all = ["lang-ru", "lang-uk"]
lang-ru = ["dict-ru"]
lang-uk = ["dict-uk"]

# Dictionary representation in memory.

# Repack dictionary into single allocation blob.
# Default choice.
dict_repr-repacked = []
# Use set of allocated data structures, instead of single blob.
# Choose this if you don't use `include static` feature and for some reason want to avoid repacking.
dict_repr-classic = []

# Loading features.
# At least one of these features must be selected.

# Statically include dictionaries in the binary,
# can be used only with dict_repr-repacked.
# The most convenient choice for most users.
dict_load-include_static = ["dict_repr-repacked", "dict-ru/include_static", "dict-uk/include_static"]
# Support for dynamically load pymorphy2 dictionaries,
# can be used with both dict_repr-classic and dict_repr-repacked.
# Useful if you want to dynamically load different dictionaries.
dict_load-pymorphy2 = []

# Tracing features.
# Normally, you don't need them.

log_trace_all = [
    "log_trace_analyzer",
    "log_trace_dawg",
    "log_trace_model",
]
log_trace_analyzer = []
log_trace_dawg = []
log_trace_model = []
# If you really need to see all these bytes.
log_trace_large = []


[dependencies]
derive_more = { version = "1.0.0-beta.3", features = ["from", "is_variant"] }
inlinable_string = { version = "0.1", features = ["serde"] }
log = "0.4"
num = "0.4"
numeri-romani = { version = "0.1", path = "../../../numeri-romani" }
smallvec = { version = "1.4", features = ["serde"] }
thiserror = "1"
unicode_categories = "0.1"

lib = { package = "rsmorphy-lib", path = "../lib" }
dict-ru = { version = "0.2", package = "rsmorphy-dict-ru", path = "../dict/ru", optional = true }
dict-uk = { version = "0.2", package = "rsmorphy-dict-uk", path = "../dict/uk", optional = true }


[dev-dependencies]
lazy_static = "1.0"
rustyline = "12"

lib-dev = { package = "rsmorphy-lib-dev", path = "../lib-dev" }


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
