[package]
name = "rsmorphy-dict-ru"
version = "0.2.0"
authors = ["Alexander Irbis <irbis.labs@gmail.com>"]
license = "MIT"
description = "Russian dictionary for rsmorphy"
keywords = ["nlp", "russian"]
categories = ["text-processing", "value-formatting"]
homepage = "https://github.com/alexander-irbis/rsmorphy"
repository = "https://github.com/alexander-irbis/rsmorphy"
documentation = "https://docs.rs/rsmorphy/"
edition = "2021"
publish = true

[features]
default = []
include_static = []


[dependencies]
lib = { package = "rsmorphy-lib", path = "../../lib" }

[build-dependencies]
byteorder = "1"
lib = { package = "rsmorphy-lib", path = "../../lib" }
