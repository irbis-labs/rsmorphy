[package]
name = "rsmorphy-lib"
version = "0.5.0-dev.1"
authors = ["Alexander Irbis <irbis.labs@gmail.com>"]
license = "MIT/Apache-2.0"
description = "Common code for rsmorphy"
keywords = []
categories = []
readme = "README.md"
homepage = "https://github.com/irbis-labs/rsmorphy"
repository = "https://github.com/irbis-labs/rsmorphy"
documentation = "https://docs.rs/rsmorphy/"
edition = "2021"
publish = true

[badges]
travis-ci = { repository = "irbis-labs/rsmorphy" }


[features]
default = ["with-serde"]

with-serde = ["serde", "serde_json"]

# Tracing features.
# Normally, you don't need them.
log_trace_all = [
    "log_trace_dawg",
    "log_trace_binpack",
]
log_trace_dawg = []
log_trace_binpack = []
# If you really need to see all these bytes.
log_trace_large = []


[dependencies]
base64 = "0.21"
byteorder = "1.3"
derive_more = { version = "1.0.0-beta.3", features = ["from", "is_variant"] }
flate2 = { version = "1.0" }
inlinable_string = { version = "0.1", features = ["serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
smallvec = { version = "1.4", features = ["serde"] }
smart-string = "0.1"
thiserror = "1"


[dev-dependencies]
lib-dev = { package = "rsmorphy-lib-dev", path = "../lib-dev" }


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
